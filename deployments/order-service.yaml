apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        - containerPort: 8084
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb-service:27017"
        - name: RABBITMQ_URI
          value: "amqp://guest:guest@rabbitmq-service:5672/"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
  - name: http
    port: 8083
    targetPort: 8083
  - name: grpc
    port: 8084
    targetPort: 8084
  type: ClusterIP
